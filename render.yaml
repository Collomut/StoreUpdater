services:
  - type: web
    name: stockmanager-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
        description: "PostgreSQL Database URL (e.g. Supabase connection string)"
      - key: JWT_SECRET
        generateValue: true
        description: "Secret key for JWT session tokens"
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 20.18.0

