name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.3)'
        required: true
        type: string
      release_notes:
        description: 'Release notes (shown in the update prompt on shop PCs)'
        required: false
        default: 'Bug fixes and improvements'
        type: string

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: 'maven'

      - name: Write config.properties (from secrets)
        shell: pwsh
        run: |
          $content = "db.url=${{ secrets.DB_URL }}`ndb.user=${{ secrets.DB_USER }}`ndb.password=${{ secrets.DB_PASSWORD }}`n"
          [System.IO.File]::WriteAllText("src/main/resources/config.properties", $content)

      - name: Set version
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllText("src/main/resources/version.properties", "app.version=${{ inputs.version }}`n")

      - name: Build fat JAR
        run: mvn package -q

      - name: Build Windows app-image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package-input | Out-Null
          Copy-Item target\StockManager-1.0.0.jar package-input\
          jpackage `
            --type app-image `
            --input package-input `
            --main-jar StockManager-1.0.0.jar `
            --name StockManager `
            --app-version ${{ inputs.version }} `
            --icon src/main/resources/images/icon.ico `
            --java-options "-Djava.net.preferIPv4Stack=true" `
            --dest dist
          Remove-Item -Recurse -Force package-input

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -Recurse -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }
          & $iscc /Q "/DAppVersion=${{ inputs.version }}" installer.iss

      - name: Update version.json & Sign
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.release_notes }}
          PRIVATE_KEY: ${{ secrets.AUTO_UPDATE_PRIVATE_KEY }}
        run: |
          [System.IO.File]::WriteAllBytes("key.der", [System.Convert]::FromBase64String($env:PRIVATE_KEY))
          openssl pkey -inform DER -in key.der -out key.pem
          openssl dgst -sha256 -sign key.pem -out jar.sig "target/StockManager-1.0.0.jar"
          $jarSigBytes = [System.IO.File]::ReadAllBytes("jar.sig")
          $jarSig = [System.Convert]::ToBase64String($jarSigBytes)
          Remove-Item -Force key.der, key.pem, jar.sig -ErrorAction SilentlyContinue

          $prevApi = "https://stockmanager-api-4hw3.onrender.com"
          if (Test-Path version.json) {
            $json = Get-Content version.json -Raw | ConvertFrom-Json
            if ($json.api_url) { $prevApi = $json.api_url }
          }

          $vObj = [ordered]@{
            version         = $env:VERSION
            api_url         = $prevApi
            download_url    = "https://github.com/Collomut/StoreUpdater/releases/download/v$($env:VERSION)/StockManager-1.0.0.jar"
            release_notes   = $env:NOTES
            signature       = $jarSig
          }

          $vJson = ConvertTo-Json $vObj -Depth 5
          [System.IO.File]::WriteAllText("version.json", $vJson)
          Get-Content version.json

      - name: Commit updated version.json
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: bump to v${{ inputs.version }}"
          git push

      - name: Write release notes file
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          $notesContent = @"
          ## Stock Manager v$env:VERSION

          $env:NOTES

          ---
          ### Downloads

          | Platform | File | Notes |
          |---|---|---|
          | 🪟 Windows | `StockManager-Setup-$env:VERSION.exe` | Wizard installer, no Java needed |
          | ☕ Any (JAR) | `StockManager-1.0.0.jar` | Requires Java 21 installed |

          ### Auto-Update
          Shop PCs running v1.0.1 or later will be prompted automatically on next launch.
          "@
          [System.IO.File]::WriteAllText("release_notes.md", $notesContent)

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $exePath = "dist-installer\StockManager-Setup-$env:VERSION.exe"
          gh release create "v$env:VERSION" target\StockManager-1.0.0.jar $exePath --title "Stock Manager v$env:VERSION" --notes-file release_notes.md
