name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.3)'
        required: true
        type: string
      release_notes:
        description: 'Release notes (shown in the update prompt on shop PCs)'
        required: false
        default: 'Bug fixes and improvements'
        type: string

jobs:

  # ── Build Windows installer ─────────────────────────────────────────────────
  build-windows:
    name: Windows — Build installer
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: 'maven'

      - name: Write config.properties (from secrets)
        shell: pwsh
        run: |
          $content = "db.url=${{ secrets.DB_URL }}`ndb.user=${{ secrets.DB_USER }}`ndb.password=${{ secrets.DB_PASSWORD }}`n"
          [System.IO.File]::WriteAllText("src/main/resources/config.properties", $content)

      - name: Set version
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllText("src/main/resources/version.properties", "app.version=${{ inputs.version }}`n")

      - name: Build fat JAR
        run: mvn package -q

      - name: Build Windows app-image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package-input | Out-Null
          Copy-Item target\StockManager-1.0.0.jar package-input\
          jpackage `
            --type app-image `
            --input package-input `
            --main-jar StockManager-1.0.0.jar `
            --name StockManager `
            --app-version ${{ inputs.version }} `
            --icon src/main/resources/images/icon.ico `
            --java-options "-Djava.net.preferIPv4Stack=true" `
            --dest dist
          Remove-Item -Recurse -Force package-input

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -Recurse -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }
          & $iscc /Q "/DAppVersion=${{ inputs.version }}" installer.iss

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/StockManager-1.0.0.jar
          retention-days: 1

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-installer/StockManager-Setup-${{ inputs.version }}.exe
          retention-days: 1

  # ── Build Linux AppImage ────────────────────────────────────────────────────
  build-linux:
    name: Linux — Build AppImage
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: 'maven'

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libfuse2 fuse imagemagick \
            libgtk-3-0 libgl1 libglu1-mesa \
            libxtst6 libxxf86vm1 libasound2t64

      - name: Write config.properties (from secrets)
        run: |
          cat > src/main/resources/config.properties << 'EOF'
          db.url=${{ secrets.DB_URL }}
          db.user=${{ secrets.DB_USER }}
          db.password=${{ secrets.DB_PASSWORD }}
          EOF

      - name: Set version
        run: echo "app.version=${{ inputs.version }}" > src/main/resources/version.properties

      - name: Build fat JAR
        run: mvn package -q

      - name: Build Linux app-image
        run: |
          mkdir -p package-input
          cp target/StockManager-1.0.0.jar package-input/
          jpackage \
            --type app-image \
            --input package-input \
            --main-jar StockManager-1.0.0.jar \
            --name StockManager \
            --app-version ${{ inputs.version }} \
            --icon src/main/resources/images/icon.png \
            --java-options "-Djava.net.preferIPv4Stack=true" \
            --dest dist
          rm -rf package-input

      - name: Download appimagetool
        run: |
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O appimagetool
          chmod +x appimagetool

      - name: Create AppDir structure
        run: |
          mkdir -p AppDir
          cp -r dist/StockManager/. AppDir/
          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")"
          export APPDIR="${HERE}"
          exec "${HERE}/bin/StockManager" "$@"
          APPRUN
          chmod +x AppDir/AppRun

          cat > AppDir/StockManager.desktop << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Stock Manager
          Exec=StockManager
          Icon=StockManager
          Categories=Office;Finance;
          Comment=Retail Stock Management System
          DESKTOP

          cp src/main/resources/images/icon.png AppDir/StockManager.png

      - name: Build AppImage
        env:
          ARCH: x86_64
          VERSION: ${{ inputs.version }}
        run: |
          ./appimagetool --appimage-extract-and-run AppDir \
            "StockManager-${VERSION}-x86_64.AppImage" 2>&1 || \
          ARCH=x86_64 ./appimagetool AppDir \
            "StockManager-${VERSION}-x86_64.AppImage"
          chmod +x "StockManager-${VERSION}-x86_64.AppImage"
          ls -lh "StockManager-${VERSION}-x86_64.AppImage"

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: StockManager-${{ inputs.version }}-x86_64.AppImage
          retention-days: 1

  # ── Create GitHub Release ───────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows]
    if: always() && !cancelled() && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Update version.json
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.release_notes }}
          PRIVATE_KEY: ${{ secrets.AUTO_UPDATE_PRIVATE_KEY }}
        run: |
          echo "$PRIVATE_KEY" | base64 -d > key.der
          openssl pkey -inform DER -in key.der -out key.pem

          openssl dgst -sha256 -sign key.pem -out jar.sig "artifacts/jar/StockManager-1.0.0.jar"
          JAR_SIG=$(base64 -w 0 jar.sig)

          APPIMAGE_SIG=""
          APPIMAGE_URL=""
          if [ -f "artifacts/linux-appimage/StockManager-${VERSION}-x86_64.AppImage" ]; then
            openssl dgst -sha256 -sign key.pem -out appimage.sig "artifacts/linux-appimage/StockManager-${VERSION}-x86_64.AppImage"
            APPIMAGE_SIG=$(base64 -w 0 appimage.sig)
            APPIMAGE_URL="https://github.com/Collomut/StoreUpdater/releases/download/v${VERSION}/StockManager-${VERSION}-x86_64.AppImage"
          fi

          rm -f key.der key.pem jar.sig appimage.sig

          PREV_API_URL=$(grep -oP '"api_url"\s*:\s*"\K[^"]+' version.json || echo "https://stockmanager-api-4hw3.onrender.com")

          cat > version.json << EOF
          {
            "version": "${VERSION}",
            "api_url": "${PREV_API_URL}",
            "download_url": "https://github.com/Collomut/StoreUpdater/releases/download/v${VERSION}/StockManager-1.0.0.jar",
            "download_url_linux": "${APPIMAGE_URL}",
            "release_notes": "${NOTES}",
            "signature": "${JAR_SIG}",
            "signature_linux": "${APPIMAGE_SIG}"
          }
          EOF
          cat version.json

      - name: Commit updated version.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: bump to v${{ inputs.version }}"
          git push

      - name: Write release notes file
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          {
            echo "## Stock Manager v${VERSION}"
            echo ""
            echo "${NOTES}"
            echo ""
            echo "---"
            echo "### Downloads"
            echo ""
            echo "| Platform | File | Notes |"
            echo "|---|---|---|"
            echo "| 🪟 Windows | \`StockManager-Setup-${VERSION}.exe\` | Wizard installer, no Java needed |"
            if [ -f "artifacts/linux-appimage/StockManager-${VERSION}-x86_64.AppImage" ]; then
              echo "| 🐧 Linux | \`StockManager-${VERSION}-x86_64.AppImage\` | Any distro, no Java needed |"
            fi
            echo "| ☕ Any (JAR) | \`StockManager-1.0.0.jar\` | Requires Java 21 installed |"
            echo ""
            echo "### Auto-Update"
            echo "Shop PCs running v1.0.1 or later will be prompted automatically on next launch."
          } > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          FILES=("artifacts/jar/StockManager-1.0.0.jar" "artifacts/windows-installer/StockManager-Setup-${VERSION}.exe")
          if [ -f "artifacts/linux-appimage/StockManager-${VERSION}-x86_64.AppImage" ]; then
            FILES+=("artifacts/linux-appimage/StockManager-${VERSION}-x86_64.AppImage")
          fi
          gh release create "v${VERSION}" "${FILES[@]}" \
            --title "Stock Manager v${VERSION}" \
            --notes-file release_notes.md
